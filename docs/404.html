<script>
  // GitHub Pages отдаёт эту страницу на любом неверном адресе, на любой глубине.
  // Корень сайта: для *.github.io/<репозиторий>/ — первая папка, для своего домена — «/».
  var base = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
  document.querySelectorAll(".home").forEach(function (a) { a.href = base + (a.dataset.hash || ""); });
